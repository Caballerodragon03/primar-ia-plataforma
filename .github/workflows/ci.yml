name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: cd packages/database && npx prisma generate
      - run: cd packages/shared && npm run build
      - run: cd packages/database && npm run build
      - run: cd packages/email && npm run build
      - run: cd apps/api && npx tsc --noEmit
      - run: cd apps/web && npx tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: cd packages/database && npx prisma generate
      - run: cd packages/shared && npm run build
      - run: cd packages/database && npm run build
      - run: cd apps/api && npm test -- --testPathPattern=unit --passWithNoTests
        env:
          QR_HMAC_SECRET: test_secret_for_ci
          NODE_ENV: test

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: cd packages/database && npx prisma generate
      - run: npm run build
